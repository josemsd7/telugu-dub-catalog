name: Update and publish catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [data/**, validation-live.json]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 --version
      - run: npm test
      - name: Refresh live metadata
        run: npm run verify
      - name: Save the updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json validation-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update live catalog metadata [skip ci]'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v4
