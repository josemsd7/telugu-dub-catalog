name: Update and publish catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [data/**, validation-live.json]
  schedule:
    # 00:00, 06:00, 12:00 and 18:00 India Standard Time (UTC+05:30).
    - cron: '30 0,6,12,18 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 --version
      - run: npm test
      - name: Refresh live metadata
        run: npm run verify
      - name: Refresh series metadata
        run: |
          if ! node verify-series.mjs; then
            node -e "const d=JSON.parse(require('fs').readFileSync('data/series.json'));if(!d.series?.length)process.exit(1);console.warn('Series refresh failed; keeping previous series snapshot from '+d.checkedAt)"
          fi
      - name: Save the updated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/series.json validation-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update live catalog metadata [skip ci]'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publish catalog
        id: deployment
        uses: actions/deploy-pages@v4


